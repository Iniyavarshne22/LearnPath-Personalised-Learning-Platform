<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnPath | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #081b29;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #102c3d;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            color: #ff7a00;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
        }

        header nav a:hover {
            color: #ff7a00;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .register-card {
            background: #102c3d;
            border: 1px solid #25485b;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .register-card h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .highlight {
            color: #ff7a00;
        }

        .subtitle {
            text-align: center;
            color: #c7d5df;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-size: 14px;
            color: #e0eaf0;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #365568;
            border-radius: 7px;
            background: #081b29;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #ff7a00;
        }

        select option {
            background: #102c3d;
            color: #ffffff;
        }

        .submit-button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #ff7a00;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-button:hover {
            background: #e96b00;
        }

        .messages {
            margin: 15px 0;
        }

        .message {
            background: #173b50;
            border: 1px solid #ff7a00;
            color: #ffd1a3;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #c7d5df;
            font-size: 14px;
        }

        .login-text a {
            color: #ff9b42;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        footer {
            background: #102c3d;
            padding: 18px;
            text-align: center;
            color: #aebfcb;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 5%;
            }

            .register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="logo" href="/">LearnPath.</a>

        <nav>
            <a href="/">← Back to Home</a>
        </nav>
    </header>

    <main>
        <section class="register-card">
            <h1>Join <span class="highlight">LearnPath</span></h1>

            <p class="subtitle">
                Create your account and start your learning journey.
            </p>

            <div class="messages">
                {% with messages = get_flashed_messages() %}
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                {% endwith %}
            </div>

            <form action="/register" method="POST">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    maxlength="100"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="150"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <label for="career_goal">Choose Your Career Goal</label>
                <select id="career_goal" name="career_goal" required>
                    <option value="">Select a career path</option>
                    <option value="Python Developer">Python Developer</option>
                    <option value="Java Developer">Java Developer</option>
                    <option value="Full-Stack Developer">Full-Stack Developer</option>
                </select>

                <button class="submit-button" type="submit">
                    Create Account →
                </button>
            </form>

            <p class="login-text">
                Already have an account?
                <a href="/login">Log in</a>
            </p>
        </section>
    </main>

    <footer>
        © 2026 LearnPath. Learn Today. Lead Tomorrow.
    </footer>

</body>
</html>
